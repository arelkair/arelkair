<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 124" width="520" height="124" role="img" aria-label="Arel Kair">
  <style>
    .name { font: 700 76px -apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #EDE8DD; }
    .bar { fill: #5FA883; transform-box: fill-box; transform-origin: left center; }
    @media (prefers-reduced-motion: no-preference) {
      .name { animation: rise 600ms cubic-bezier(0.23, 1, 0.32, 1) both; }
      .bar { animation: grow 500ms cubic-bezier(0.23, 1, 0.32, 1) 120ms both; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  </style>
  <text class="name" x="2" y="80">Arel Kair</text>
  <rect class="bar" x="6" y="102" width="56" height="6" rx="3"/>
</svg>
